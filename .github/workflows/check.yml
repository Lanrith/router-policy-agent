name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.9', '1.27.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Module integrity
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Build and vet
        run: |
          make build
          make vet
      - name: Race and shuffled tests including Linux IPC
        run: go test -race -shuffle=on -count=1 -tags integration -coverprofile=coverage.out ./...
      - name: Core coverage floor
        run: |
          go tool cover -func=coverage.out | awk '/total:/ { sub(/%/, "", $3); if ($3 < 80) exit 1 }'
      - name: Fuzz properties
        if: matrix.go == '1.27.2'
        run: make fuzz
  integration:
    name: Isolated Linux UID boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: docker.io/library/golang@sha256:cf7e928cb9edc2ed8b3cc6fe77ee1ee30b9fea28149564c8840097321a7600ea # Go 1.26.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qualify actual unprivileged peer and durable state
        run: |
          test "$(id -u)" = 0
          go test -race -shuffle=on -count=1 -tags integration ./internal/ipc ./internal/hostfs ./internal/state ./internal/firewall ./internal/reader ./internal/cli
  kernel:
    name: Isolated nftables transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qualify actual kernel expiry and atomic owned updates
        run: ROUTER_POLICY_REQUIRE_HEADER_TEST=1 make kernel
      - name: Qualify non-root IPC through the actual guarded native backend
        run: make kernel-service
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Pinned static and security linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run --build-tags integration,kernel,servicekernel ./...
  security:
    name: Vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Pinned vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  required:
    name: Required checks
    if: always()
    needs: [test, integration, kernel, lint, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every qualification gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYRESULT'
          import json,os
          results=json.loads(os.environ['RESULTS'])
          assert results and all(job['result']=='success' for job in results.values())
          PYRESULT
