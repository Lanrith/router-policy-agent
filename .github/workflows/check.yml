name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  toolchains:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      integration-image: ${{ steps.config.outputs.integration-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: config
        run: |
          python3 - <<'PYCONFIG'
          import json,os,re
          v=json.load(open('.github/toolchains.json'))
          assert set(v)=={'go','integration_image'} and set(v['go'])=={'current','previous'}
          assert all(re.fullmatch(r'1[.](26|27)[.][0-9]+',x) for x in v['go'].values())
          assert open('.go-version').read().strip()==v['go']['current']
          assert re.fullmatch(r'docker[.]io/library/golang@sha256:[0-9a-f]{64}',v['integration_image'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('matrix='+json.dumps({'include':[{'go':version,'role':role} for role,version in sorted(v['go'].items())]})+'\n')
              stream.write('integration-image='+v['integration_image']+'\n')
          PYCONFIG
  test:
    needs: toolchains
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchains.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Module integrity
        run: |
          go mod verify
          go mod tidy
          # Packaging records notices for the complete locked graph, including modules
          # outside the Linux build. Keep its authenticated checksums in source too.
          go mod download all
          git diff --exit-code
      - name: Formatting
        if: matrix.role == 'current'
        run: test -z "$(gofmt -l cmd internal)"
      - name: Build and vet
        run: |
          make build
          make vet
      - name: Race and shuffled tests including Linux IPC
        run: go test -race -shuffle=on -count=1 -tags integration -coverprofile=coverage.out ./...
      - name: Fuzz properties
        if: matrix.role == 'current'
        run: make fuzz
  integration:
    needs: toolchains
    name: Isolated Linux UID boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ${{ needs.toolchains.outputs.integration-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Qualify actual unprivileged peer and durable state
        run: |
          test "$(id -u)" = 0
          go test -race -shuffle=on -count=1 -tags integration -coverprofile=coverage.out ./...
      - name: Core coverage floor
        run: |
          go tool cover -func=coverage.out | awk '/total:/ { sub(/%/, "", $3); if ($3 < 80) exit 1 }'
  kernel:
    name: Isolated nftables transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qualify actual kernel expiry and atomic owned updates
        run: ROUTER_POLICY_REQUIRE_HEADER_TEST=1 make kernel
      - name: Qualify non-root IPC through the actual guarded native backend
        run: make kernel-service
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Pinned static and security linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run --build-tags integration,kernel,servicekernel ./...
  security:
    name: Vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Pinned vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  required:
    name: Required checks
    if: always()
    needs: [toolchains, test, integration, kernel, lint, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every qualification gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYRESULT'
          import json,os
          results=json.loads(os.environ['RESULTS'])
          assert results and all(job['result']=='success' for job in results.values())
          PYRESULT
