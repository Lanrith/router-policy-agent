name: Release
on:
  push:
    branches: [main]
    paths: ['cmd/**', 'internal/**', 'go.mod', 'go.sum', 'packaging/**', '.github/workflows/**', 'VERSION']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    if: github.repository == 'Lanrith/router-policy-agent'
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/next-version.py
  release:
    needs: version
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.version.outputs.value }}
