name: Request human review
on:
  workflow_run:
    workflows: [Review routing, CI, Check]
    types: [in_progress, completed]
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: maintenance-human-review-${{ github.event.workflow_run.head_sha || inputs.pr || github.run_id }}
  cancel-in-progress: false
jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    uses: Lanrith/lanrith/.github/workflows/request-human-review.yml@a01ce75baadc45f7da2958a92374384980c99e2f
    with:
      pr: ${{ fromJSON(inputs.pr || '0') }}
