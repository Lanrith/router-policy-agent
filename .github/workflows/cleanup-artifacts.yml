name: Clean completed Actions handoffs
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-cleanup-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    uses: Lanrith/lanrith/.github/workflows/cleanup-artifacts.yml@90b88b65950375f75d331d67dd21da4f2a108018
