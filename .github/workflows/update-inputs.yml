name: Propose dependency updates
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-propose-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: write
      id-token: write
      attestations: write
    uses: Lanrith/lanrith/.github/workflows/security-proposal.yml@006302c0336a814a754693b4c93b4953b4315dc7
    secrets: inherit
