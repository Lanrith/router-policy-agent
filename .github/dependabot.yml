version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
      time: '04:17'
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    # Shared controller references must move together with their verified source record.
    groups:
      lanrith-maintenance:
        patterns: ['Lanrith/lanrith/*']
    directory: /
    schedule:
      interval: weekly
      time: '04:17'
      timezone: UTC
