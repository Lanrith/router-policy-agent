version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
      time: '04:17'
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: '04:17'
      timezone: UTC
